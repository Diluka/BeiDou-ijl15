name: Maple agent bridge

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/**
    paths:
      - ezorsia/**
      - detours/**
      - ezorsia.sln
      - tools/build-agent-bridge.ps1
      - .github/workflows/agent-bridge.yml
  pull_request:
    paths:
      - ezorsia/**
      - detours/**
      - ezorsia.sln
      - tools/build-agent-bridge.ps1
      - .github/workflows/agent-bridge.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build Release Win32 and record its source
        shell: pwsh
        run: ./tools/build-agent-bridge.ps1
      - name: Upload DLL and source manifest
        uses: actions/upload-artifact@v4
        with:
          name: maple-agent-bridge-win32
          path: out/agent-bridge/
          if-no-files-found: error
          retention-days: 30
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maple-agent-bridge-build-log
          path: out/build.log
          if-no-files-found: ignore
          retention-days: 14
